const EDGE_GROUPS = {
  'page-service': { color: '#1B1815', label: 'Page uses' },
  'page-data': { color: '#7A8C6E', label: 'Page uses' },
  'model-service': { color: '#8B8276', label: 'Implies' },
};

const NW = 132, NH = 28, GLYPH = 11;

let W = () => document.getElementById('graphContainer').clientWidth;
let H = () => document.getElementById('graphContainer').clientHeight - 0;

const svg = document.getElementById('graph');
const edgesLayer = document.getElementById('edgesLayer');
const nodesLayer = document.getElementById('nodesLayer');
const tooltip = document.getElementById('tooltip');

const nodeMap = {};
NODES.forEach(n => nodeMap[n.id] = { ...n, tx: n.x, ty: n.y });

const strengths = [1.05, 1.15, 1.25, 1.35, 1.45]; // displacementTowards center
function step(){
  const cx = 0, cy = 0;
  // cute lattice: nodes keep x,y but edges push non-neighbours away slightly and attract same cluster
  // implemented as small force pass for layout stability
}
let scale = 0.68;
let panX = 20, panY = 16;
let dragging = null, dragMode = null; // 'node'|'pan'
let prevM = null;

function project(id){
  const n = nodeMap[id];
  return { x: n.x*scale + panX, y: n.y*scale + panY };
}
function pathBtw(a,b){
  const A = project(a), B = project(b);
  // bezier in vertical-ish separation
  const dx = B.x - A.x, dy = B.y - A.y;
  const cp = Math.min(120, Math.max(dy/2, 40));
  return `M${A.x},${A.y+NH} C${A.x},${A.y+NH+cp} ${B.x},${B.y-cp} ${B.x},${B.y}`;
}

function kColors(g){
  switch(g){
    case 'html': return '#1B1815';
    case 'bootstrap': return '#7C2D2D';
    case 'service': return '#E7E1D8';
    case 'component': return '#F4E7E1';
    case 'data': return '#FFFFFF';
    case 'page': return '#7A8C6E';
    case 'css': return '#fff';
    default: return '#fff';
  }
}

function render(){
  const filter = document.getElementById('layerFilter').value;
  const visible = new Set(filter === 'all' ? NODES.map(n=>n.id) : NODES.filter(n => n.group === filter).map(n=>n.id));

  // Edges where both ends are visible
  const visibleEdges = EDGES.filter(e => visible.has(e.from) && visible.has(e.to));
  const visibleNodes = NODES.filter(n => visible.has(n.id));

  edgesLayer.innerHTML = '';
  nodesLayer.innerHTML = '';

  visibleEdges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if(!a || !b) return;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', pathBtw(e.from,e.to));
    p.setAttribute('class','arrow ' + (e.from.includes('HTML') ? '' : ''));
    // color based on target group primarily
    p.setAttribute('stroke', e.group==='page-service'?'#1B1815':e.group==='page-data'?'#7A8C6E':'#cbbfac');
    p.setAttribute('marker-end', 'url(#arr)');
    edgesLayer.appendChild(p);
  });

  visibleNodes.forEach(n => {
    const c = project(n.id);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform', `translate(${c.x},${c.y})`);
    g.setAttribute('data-id', n.id);

    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('width', NW);
    rect.setAttribute('height', NH);
    rect.setAttribute('rx', '2');
    rect.setAttribute('fill', kColors(n.group));
    if(n.group === 'data') rect.setAttribute('stroke','#E7E1D8');
    if(n.group === 'css') { rect.setAttribute('stroke','#7C2D2D'); rect.setAttribute('fill','#FFD6D6'); }
    g.appendChild(rect);

    const tile = document.createElementNS('http://www.w3.org/2000/svg','rect');
    tile.setAttribute('class','tile');
    tile.setAttribute('width','4');
    tile.setAttribute('height','22');
    tile.setAttribute('y','3');
    tile.setAttribute('x','4');
    g.appendChild(tile);

    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x','14');
    text.setAttribute('y','19');
    text.textContent = n.label;
    g.appendChild(text);

    g.addEventListener('mousemove', (ev) => {
      tooltip.style.opacity = '1';
      tooltip.style.left = (ev.clientX + 10) + 'px';
      tooltip.style.top = (ev.clientY + 12) + 'px';
      tooltip.textContent = GROUPS[n.group]?.label || n.group;
    });
    g.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });

    g.addEventListener('mousedown', (ev) => {
      if(ev.button !== 0) return;
      if(ev.target.closest('rect')){
        ev.stopPropagation();
        prevM = { x: ev.clientX, y: ev.clientY, panX, panY, node: n.id };
        svg.style.cursor = 'grabbing';
        return;
      }
      // else pan if clicking background
      prevM = { x: ev.clientX, y: ev.clientY, panX, panY };
      svg.style.cursor = 'grabbing';
    });

    nodesLayer.appendChild(g);
  });
}

document.addEventListener('mousemove', (ev) => {
  if(!prevM) return;
  const dx = ev.clientX - prevM.x, dy = ev.clientY - prevM.y;
  if(prevM.node){
    // node drag - simple bias
    nodeMap[prevM.node].x += dx/scale;
    nodeMap[prevM.node].y += dy/scale;
  }else{
    panX = prevM.panX + dx;
    panY = prevM.panY + dy;
  }
  prevM.x = ev.clientX; prevM.y = ev.clientY;
  render();
});
document.addEventListener('mouseup', () => { prevM = null; svg.style.cursor = 'default'; });
svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  scale = Math.max(0.5, Math.min(1.6, scale + (ev.deltaY > 0 ? -0.07 : 0.07)));
  render();
}, { passive: false });

document.getElementById('layerFilter').addEventListener('change', render);
window.addEventListener('resize', render);

document.getElementById('btnReset').addEventListener('click', () => {
  panX = 20; panY = 16; scale = 0.68;
  NODES.forEach(n => { n.x = n.tx || n.x; n.y = n.ty || n.y; });
  render();
});

document.getElementById('btnExportExport').addEventListener('click', () => {
  const data = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pratohub-dependencies.svg'; a.click();
});

render();
